name: Sincronizar Second Brain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronizar-second-brain
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CACHE_KEY: ${{ secrets.MS_CACHE_KEY }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install msal requests cryptography

      - name: Restaurar cache de autenticacao
        uses: actions/cache/restore@v4
        with:
          path: .auth
          key: msal-auth-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            msal-auth-${{ runner.os }}-

      - name: Verificar arquivos da automacao
        run: |
          test -f SINCRONIZAR-DOCUMENTOS-AGENDA.py
          test -f SINCRONIZAR-AGENDA.py
          python -m py_compile SINCRONIZAR-DOCUMENTOS-AGENDA.py
          python -m py_compile SINCRONIZAR-AGENDA.py

      - name: Sincronizar documentos com a agenda
        run: python -u SINCRONIZAR-DOCUMENTOS-AGENDA.py

      - name: Sincronizar agenda com o Outlook
        run: python -u SINCRONIZAR-AGENDA.py

      - name: Salvar cache de autenticacao
        if: always() && hashFiles('.auth/msal_cache.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: .auth
          key: msal-auth-${{ runner.os }}-${{ github.run_id }}
