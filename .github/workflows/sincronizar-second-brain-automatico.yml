name: Sincronizar Second Brain com Outlook

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions usa UTC.
    # Executa a cada 6 horas, no minuto 17.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sincronizar-second-brain-outlook
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
  MS_CACHE_KEY: ${{ secrets.MS_CACHE_KEY }}

jobs:
  sincronizar:
    name: Documentos, agenda, Outlook e To Do
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install msal requests cryptography

      - name: Restaurar cache de autenticacao
        id: restaurar-cache-msal
        uses: actions/cache/restore@v4
        with:
          path: .auth/msal_cache.bin
          key: msal-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            msal-cache-

      - name: Aplicar cache renovado com Tasks.ReadWrite
        env:
          MSAL_CACHE_B64: ${{ secrets.MSAL_CACHE_B64 }}
        run: |
          if [ -n "$MSAL_CACHE_B64" ]; then
            mkdir -p .auth
            printf '%s' "$MSAL_CACHE_B64" | tr -d '\r\n ' | base64 --decode > .auth/msal_cache.bin
            chmod 600 .auth/msal_cache.bin
            echo "Cache renovado com Tasks.ReadWrite aplicado."
          else
            echo "MSAL_CACHE_B64 nao configurado. Mantendo cache restaurado pelo GitHub Actions."
          fi

      - name: Verificar secrets
        run: |
          test -n "$MS_CLIENT_ID" || {
            echo "ERRO: MS_CLIENT_ID nao configurado."
            exit 1
          }

          test -n "$MS_CACHE_KEY" || {
            echo "ERRO: MS_CACHE_KEY nao configurado."
            exit 1
          }

          echo "Secrets encontrados."

      - name: Verificar arquivos
        run: |
          test -f categorias_outlook.py || {
            echo "ERRO: categorias_outlook.py nao encontrado."
            exit 1
          }

          test -f SINCRONIZAR-DOCUMENTOS-AGENDA.py || {
            echo "ERRO: SINCRONIZAR-DOCUMENTOS-AGENDA.py nao encontrado."
            exit 1
          }

          test -f SINCRONIZAR-AGENDA.py || {
            echo "ERRO: SINCRONIZAR-AGENDA.py nao encontrado."
            exit 1
          }

          test -f SINCRONIZAR-TODO.py || {
            echo "ERRO: SINCRONIZAR-TODO.py nao encontrado."
            exit 1
          }

          echo "Todos os arquivos foram encontrados."

      - name: Procurar caracteres invalidos
        run: |
          if grep -n '\\]' \
            categorias_outlook.py \
            SINCRONIZAR-DOCUMENTOS-AGENDA.py \
            SINCRONIZAR-AGENDA.py \
            SINCRONIZAR-TODO.py
          then
            echo "ERRO: encontrada barra invertida antes de colchete."
            exit 1
          fi

          echo "Nenhum caractere invalido encontrado."

      - name: Validar scripts Python
        run: |
          python -m py_compile categorias_outlook.py
          python -m py_compile SINCRONIZAR-DOCUMENTOS-AGENDA.py
          python -m py_compile SINCRONIZAR-AGENDA.py
          python -m py_compile SINCRONIZAR-TODO.py

          echo "Todos os scripts passaram na validacao."

      - name: Sincronizar documentos com agenda
        run: |
          python -u SINCRONIZAR-DOCUMENTOS-AGENDA.py

      - name: Sincronizar agenda com Outlook
        run: |
          python -u SINCRONIZAR-AGENDA.py

      - name: Sincronizar Microsoft To Do
        env:
          MS_CACHE_FILE: .auth/msal_cache.bin
          SB_TODO_TABLE: tbTodo
          SB_FORCE_LOGIN: "0"
          SB_RECREATE_MISSING: "0"
        run: |
          python -u SINCRONIZAR-TODO.py

      - name: Salvar cache de autenticacao atualizado
        if: always() && hashFiles('.auth/msal_cache.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: .auth/msal_cache.bin
          key: msal-cache-${{ github.run_id }}-${{ github.run_attempt }}
