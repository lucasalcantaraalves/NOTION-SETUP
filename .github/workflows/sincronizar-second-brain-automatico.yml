name: Sincronizar Second Brain automaticamente

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install msal requests cryptography

      - name: Restaurar cache MSAL
        env:
          MSAL_CACHE_B64: ${{ secrets.MSAL_CACHE_B64 }}
        run: |
          echo "$MSAL_CACHE_B64" | base64 --decode > msal_cache.enc

      - name: Validar scripts
        run: |
          python -m py_compile SINCRONIZAR-DOCUMENTOS-AGENDA.py
          python -m py_compile SINCRONIZAR-AGENDA.py
          python -m py_compile SINCRONIZAR-TODO.py

      - name: Sincronizar documentos com agenda
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CACHE_KEY: ${{ secrets.MS_CACHE_KEY }}
        run: |
          python SINCRONIZAR-DOCUMENTOS-AGENDA.py

      - name: Sincronizar agenda com Outlook
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CACHE_KEY: ${{ secrets.MS_CACHE_KEY }}
        run: |
          python SINCRONIZAR-AGENDA.py

      - name: Sincronizar Microsoft To Do
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CACHE_KEY: ${{ secrets.MS_CACHE_KEY }}
          MS_CACHE_FILE: msal_cache.enc
          SB_TODO_TABLE: tbTodo
          SB_FORCE_LOGIN: "0"
          SB_RECREATE_MISSING: "0"
        run: |
          python SINCRONIZAR-TODO.py

      - name: Preparar cache MSAL atualizado
        if: always()
        run: |
          if [ -f msal_cache.enc ]; then
            base64 -w 0 msal_cache.enc > msal-cache-atualizado.b64
          fi

      - name: Salvar cache MSAL atualizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msal-cache-atualizado
          path: msal-cache-atualizado.b64
          if-no-files-found: warn
          retention-days: 1
