name: Teste Microsoft Graph

on:
  workflow_dispatch:

jobs:
  teste-microsoft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install msal requests

      - name: Localizar Excel no OneDrive
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python -u TESTE-AUTH-MICROSOFT.py
